<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JEROME // TRADE DESK</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap');
  :root{
    --bg:#050805; --bg2:#070c07;
    --primary:#39ff6a; --primary-dim:#163a20;
    --red:#ff3b4e; --red-dim:#5a1a22;
    --amber:#ffb020; --green:#4dffa8;
    --text:#d9e8d9; --text-dim:#6b8a6b;
    --grid: rgba(57,255,106,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 30%, #0a1a0a 0%, var(--bg) 65%);
    color:var(--text); font-family:'Space Mono', monospace; overflow:hidden;
  }
  #matrixCanvas{ position:fixed; inset:0; z-index:0; opacity:0.35; }

  .boot-overlay{
    position:fixed; inset:0; z-index:100;
    background:#050805;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 0.8s ease;
  }
  .boot-overlay.fade-out{ opacity:0; pointer-events:none; }
  .boot-lines{
    width:min(700px, 88vw); font-size:12px; line-height:1.9; color:var(--primary);
    text-shadow:0 0 6px rgba(57,255,106,0.5);
  }
  .boot-lines div{ opacity:0; animation: bootFadeIn 0.15s ease forwards; }
  .boot-lines .ok{ color:var(--primary); }
  @keyframes bootFadeIn{ to{ opacity:1; } }

  .frame{ height:100vh; width:100vw; display:grid; position:relative; z-index:1;
    grid-template-columns: 1.4fr 1fr; grid-template-rows: auto 1.3fr 1fr 1.2fr; gap:14px; padding:20px; }

  .flights{ grid-column: 1 / 3; grid-row: 4; }
  #flightMap{ width:100%; height:100%; border-radius:3px; filter: invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(1.05); }
  .flight-count{ position:absolute; top:8px; right:14px; font-size:9px; color:var(--primary); z-index:5; }

  .topbar{ grid-column:1/3; display:flex; align-items:baseline; gap:20px; padding-bottom:10px; border-bottom:1px solid var(--primary-dim); }
  .topbar .logo{ font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:3px; color:var(--primary); font-size:15px; text-shadow:0 0 10px rgba(57,255,106,0.6); }
  .pnl{ font-family:'Orbitron',sans-serif; font-size:30px; font-weight:700; color:var(--primary); text-shadow:0 0 12px rgba(57,255,106,0.5); }
  .pnl-label{ font-size:10px; color:var(--text-dim); letter-spacing:2px; }
  .disclaimer-top{ margin-left:auto; font-size:9px; color:var(--text-dim); letter-spacing:1px; max-width:280px; text-align:right; }

  .panel{ border:1px solid var(--primary-dim); background:linear-gradient(180deg, rgba(6,14,8,0.94), rgba(6,14,8,0.9));
    padding:38px 14px 14px 14px; position:relative; min-height:0; overflow:auto;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  .panel::before{ content:attr(data-label); position:absolute; top:8px; left:14px; background:var(--primary); padding:2px 8px;
    font-size:11px; font-weight:700; letter-spacing:2px; color:#04170a; font-family:'Orbitron',sans-serif; z-index:2; }
  .panel .tag{ position:absolute; top:8px; right:14px; font-size:8px; letter-spacing:1px; color:var(--text-dim); }
  .panel .tag.live{ color:var(--primary); }

  .chart-wrap{ grid-column:1; grid-row:2; }
  .chart-wrap svg{ width:100%; height:80%; }

  .poly-wrap{ grid-column:2; grid-row:2; overflow:hidden; }
  .poly-row{ display:flex; justify-content:space-between; align-items:center; font-size:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.06); gap:8px; }
  .poly-q{ color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .poly-yes{ color:var(--green); font-weight:700; width:44px; text-align:right; }
  .poly-no{ color:var(--red); font-weight:700; width:44px; text-align:right; }

  .positions{ grid-column:1; grid-row:3; }
  .pos-row{ display:grid; grid-template-columns: 1fr 60px 60px 70px; font-size:10px; padding:4px 0; color:var(--text-dim); }
  .pos-row.header{ color:var(--primary); letter-spacing:1px; }
  .pos-up{ color:var(--green); } .pos-down{ color:var(--red); }

  .log{ grid-column:2; grid-row:3; }
  .log-feed{ font-size:9px; line-height:1.7; height:100%; overflow:hidden; color:var(--text-dim); }
  .log-feed div{ white-space:nowrap; }
  .log-feed .fill{ color:var(--green); } .log-feed .miss{ color:var(--red); }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<div id="bootOverlay" class="boot-overlay">
  <div id="bootLines" class="boot-lines"></div>
</div>
<div class="frame">
  <div class="topbar">
    <div class="logo">JEROME // TRADE DESK</div>
    <div>
      <div class="pnl" id="pnl">+$0.00</div>
      <div class="pnl-label">SESSION P&amp;L — SIMULATED</div>
    </div>
    <div>
      <div class="pnl" id="botPnl">BOT OFF</div>
      <div class="pnl-label" id="botLabel">PAPER BOT — SAY "START TRADING BOT"</div>
    </div>
    <div class="disclaimer-top">Simulated display only. Not a trading signal, not financial advice.</div>
  </div>

  <div class="panel chart-wrap" data-label="EQUITY CURVE">
    <span class="tag">SIMULATED</span>
    <svg id="curveSvg" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
  </div>

  <div class="panel poly-wrap" data-label="POLYMARKET — LIVE ODDS">
    <span class="tag live" id="polyStatus">LIVE</span>
    <div id="polyList" style="margin-top:6px;"></div>
  </div>

  <div class="panel positions" data-label="OPEN POSITIONS">
    <span class="tag">SIMULATED</span>
    <div class="pos-row header"><span>MARKET</span><span>SIDE</span><span>QTY</span><span>P&amp;L</span></div>
    <div id="posList"></div>
  </div>

  <div class="panel log" data-label="TRADE LOG">
    <span class="tag">SIMULATED</span>
    <div class="log-feed" id="logFeed"></div>
  </div>

  <div class="panel flights" data-label="FLIGHT TRACKER">
    <span class="tag live" id="flightStatus">LIVE</span>
    <div class="flight-count" id="flightCount">— aircraft</div>
    <div id="flightMap"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- Boot sequence ----------
(function(){
  const lines = [
    "[ OK ] Initializing JEROME trade desk...",
    "[ OK ] Connecting to Polymarket feed...",
    "[ OK ] Connecting to flight tracker...",
    "[ OK ] Loading simulated position ledger...",
    "[ OK ] Risk checks armed...",
    "[ OK ] All systems nominal.",
    "",
    "Welcome back. Jerome here. How can I help you, boss?"
  ];
  const container = document.getElementById('bootLines');
  const overlay = document.getElementById('bootOverlay');
  lines.forEach((text, i) => {
    const div = document.createElement('div');
    div.style.animationDelay = (i * 0.28) + 's';
    if(text.startsWith('[ OK ]')){
      div.innerHTML = `<span class="ok">[ OK ]</span>${text.slice(6)}`;
    } else {
      div.textContent = text;
    }
    container.appendChild(div);
  });
  const totalDelay = lines.length * 280 + 900;
  setTimeout(() => {
    overlay.classList.add('fade-out');
    setTimeout(() => overlay.remove(), 900);
  }, totalDelay);
})();

// ---------- Matrix digital rain background ----------
(function(){
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops;
  const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ0123456789ABCDEFJEROME';
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w/16);
    drops = new Array(cols).fill(0).map(()=>Math.random()*-50);
  }
  window.addEventListener('resize', resize);
  resize();
  function draw(){
    ctx.fillStyle = 'rgba(5,8,5,0.12)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#39ff6a';
    ctx.font = '14px monospace';
    drops.forEach((y,i)=>{
      const char = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(char, i*16, y*16);
      drops[i] = (y*16 > h && Math.random() > 0.975) ? 0 : y + 1;
    });
  }
  setInterval(draw, 50);
})();

// ---------- Simulated equity curve + P&L (clearly illustrative) ----------
let equity = [];
let pnl = 0;
for(let i=0;i<40;i++){ equity.push(0); }
function stepEquity(){
  pnl += (Math.random()-0.45) * 30;
  equity.push(pnl); if(equity.length>40) equity.shift();
  document.getElementById('pnl').textContent = (pnl>=0?'+':'') + '$' + pnl.toFixed(2);
  document.getElementById('pnl').style.color = pnl>=0 ? 'var(--green)' : 'var(--red)';
  drawCurve();
}
function drawCurve(){
  const svg = document.getElementById('curveSvg');
  const min = Math.min(...equity), max = Math.max(...equity, 1);
  const range = (max-min)||1;
  const pts = equity.map((v,i)=>{
    const x = i/(equity.length-1)*600;
    const y = 200 - ((v-min)/range)*180 - 10;
    return `${x},${y}`;
  }).join(' ');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${pnl>=0?'var(--primary)':'var(--red)'}" stroke-width="2" opacity="0.9"/>`;
}
setInterval(stepEquity, 2000); stepEquity();

// ---------- Simulated open positions ----------
const posNames = ['BTC-PERP','ETH-PERP','NVDA','TSLA'];
function renderPositions(){
  const el = document.getElementById('posList');
  el.innerHTML = posNames.map(n=>{
    const pnlv = (Math.random()-0.45)*80;
    const cls = pnlv>=0 ? 'pos-up' : 'pos-down';
    return `<div class="pos-row"><span>${n}</span><span>${Math.random()>0.5?'LONG':'SHORT'}</span><span>${(Math.random()*3).toFixed(2)}</span><span class="${cls}">${pnlv>=0?'+':''}$${pnlv.toFixed(2)}</span></div>`;
  }).join('');
}
setInterval(renderPositions, 4000); renderPositions();

// ---------- Simulated trade log ----------
const logTemplates = [
  '{t} order routed :: {s} {q} {n} @ {p}',
  '{t} fill confirmed :: {n} {p}',
  '{t} watching spread :: {n}',
  '{t} risk check passed :: {n}',
];
function pad(n){return n.toString().padStart(2,'0');}
function pushLog(){
  const feed = document.getElementById('logFeed');
  const now = new Date();
  const t = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const n = posNames[Math.floor(Math.random()*posNames.length)];
  const s = Math.random()>0.5?'BUY':'SELL';
  const q = (Math.random()*2).toFixed(2);
  const p = (Math.random()*400+50).toFixed(2);
  const line = logTemplates[Math.floor(Math.random()*logTemplates.length)]
    .replace('{t}',t).replace('{s}',s).replace('{q}',q).replace('{n}',n).replace('{p}',p);
  const cls = line.includes('fill') ? 'fill' : (line.includes('risk') ? '' : '');
  const div = document.createElement('div');
  div.className = cls; div.textContent = line;
  feed.appendChild(div);
  if(feed.children.length>10) feed.removeChild(feed.firstChild);
}
setInterval(pushLog, 1500); pushLog();

// ---------- LIVE Polymarket odds (Gamma API, public, no key) ----------
async function loadPolymarket(){
  const statusEl = document.getElementById('polyStatus');
  try{
    const res = await fetch('https://gamma-api.polymarket.com/markets?active=true&closed=false&order=volume&ascending=false&limit=8');
    const data = await res.json();
    const el = document.getElementById('polyList');
    el.innerHTML = data.map(m=>{
      let yes = '—', no = '—';
      try{
        const prices = JSON.parse(m.outcomePrices || '[]');
        if(prices.length>=2){
          yes = (parseFloat(prices[0])*100).toFixed(0)+'%';
          no  = (parseFloat(prices[1])*100).toFixed(0)+'%';
        }
      }catch(e){}
      const q = (m.question || 'Unknown market').slice(0,50);
      return `<div class="poly-row"><span class="poly-q">${q}</span><span class="poly-yes">${yes}</span><span class="poly-no">${no}</span></div>`;
    }).join('');
    statusEl.textContent = 'LIVE'; statusEl.className='tag live';
  }catch(e){
    statusEl.textContent = 'FEED UNAVAILABLE'; statusEl.className='tag';
    console.log('Polymarket fetch failed:', e);
  }
}
setInterval(loadPolymarket, 30000); loadPolymarket();

// ---------- LIVE flight tracker (adsb.lol via CORS proxy) ----------
const CENTER_LAT = 29.4241, CENTER_LON = -98.4936; // San Antonio, TX — change to your location
const FLIGHT_RADIUS_NM = 150; // max 250

const map = L.map('flightMap', { zoomControl:false, attributionControl:false }).setView([CENTER_LAT, CENTER_LON], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { subdomains:'abc', maxZoom:19 }).addTo(map);

let flightMarkers = [];
function planeIcon(heading){
  return L.divIcon({ className:'', html:`<div style="transform:rotate(${heading}deg); color:#ff3b4e; font-size:12px; text-shadow:0 0 5px #ff3b4e;">✈</div>`, iconSize:[14,14] });
}
// Tries multiple CORS proxies in order, since any single free proxy can go down or time out.
async function fetchViaProxy(targetUrl){
  const proxies = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  ];
  for(const build of proxies){
    try{
      const res = await fetch(build(targetUrl), { signal: AbortSignal.timeout(7000) });
      if(res.ok) return res;
    }catch(e){ /* try next proxy */ }
  }
  throw new Error('All CORS proxies failed');
}
async function updateFlights(){
  const statusEl = document.getElementById('flightStatus');
  try{
    const targetUrl = `https://api.adsb.lol/v2/point/${CENTER_LAT}/${CENTER_LON}/${FLIGHT_RADIUS_NM}`;
    const res = await fetchViaProxy(targetUrl);
    const data = await res.json();
    flightMarkers.forEach(m=>map.removeLayer(m)); flightMarkers=[];
    const aircraft = data.ac || [];
    aircraft.forEach(a=>{
      if(a.lat==null||a.lon==null) return;
      const heading = a.track || a.true_heading || 0;
      const label = (a.flight||a.hex||'?').trim();
      const m = L.marker([a.lat,a.lon],{icon:planeIcon(heading)}).bindPopup(label);
      m.addTo(map); flightMarkers.push(m);
    });
    document.getElementById('flightCount').textContent = aircraft.length + ' aircraft';
    statusEl.textContent = 'LIVE'; statusEl.className = 'tag live';
  }catch(e){
    document.getElementById('flightCount').textContent = 'feed unavailable';
    statusEl.textContent = 'FEED UNAVAILABLE'; statusEl.className = 'tag';
  }
}
setInterval(updateFlights, 30000); updateFlights();

// ---- Real paper-trading bot numbers (via Jerome's /api/bot proxy) ----
async function updateBot(){
  const el=document.getElementById('botPnl'), lb=document.getElementById('botLabel');
  try{
    const d=await (await fetch('/api/bot')).json();
    const live=d.live; if(!live){ el.textContent='BOT OFF'; el.style.color=''; lb.textContent='PAPER BOT — SAY "START TRADING BOT"'; return; }
    let eq=0,start=0,tr=0;
    for(const m of Object.values(live)){ const s=m.stats||{}; eq+=s.equity||0; start+=(s.start_cash||10000); tr+=s.trades||0; }
    const pnl=eq-start;
    el.textContent=(pnl>=0?'+':'-')+'$'+Math.abs(pnl).toLocaleString(undefined,{maximumFractionDigits:0});
    el.style.color=pnl>=0?'':'#ff5c5c';
    lb.textContent='PAPER BOT — REAL PRICES, FAKE MONEY — '+tr+' TRADES';
  }catch(e){ el.textContent='BOT OFF'; }
}
setInterval(updateBot,5000); updateBot();
</script>
</body>
</html>
